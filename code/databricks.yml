# Declarative Automation Bundle for client__revantage__luxembourg-workshop__2026-10-08__tbd.
# This file is the single source of environment config: to port the demo, add/edit a target
# below and run `databricks bundle deploy -t <target>`. Resource files under resources/ reference
# these variables and never hardcode a workspace, catalog, schema, or path.
bundle:
  name: client__revantage__luxembourg_workshop__2026_10_08__tbd
  engine: direct # direct deployment engine (no Terraform); required for some resource types, e.g. catalogs

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog the demo writes to
  schema:
    description: Schema for all demo data (created by this bundle)
  warehouse_id:
    description: SQL warehouse used by dashboards, Genie, alerts, and the app
  experiment_path:
    description: Workspace folder for MLflow experiments
  genie_space_path:
    description: Workspace folder for Genie spaces
  dashboard_path:
    description: Workspace folder for AI/BI dashboards
  alerts_path:
    description: Workspace folder for SQL alerts
  app_name:
    description: Lease Expiry Tracker app name, Demo 9 (lowercase letters, numbers, hyphens; max 30 chars)
  as_of:
    description: Workshop day 1 (YYYY-MM-DD). Lease-expiry windows are relative to this date.
    default: "2026-10-13"
  approvals_app_name:
    description: Invoice Approvals app name, Demo 12 (lowercase letters, numbers, hyphens; max 30 chars)
  workspace_id:
    description: Numeric workspace ID (the ?o= value in the URL). System tables span the account, so Demo 13 filters on it.
  consumer_group:
    description: Account group of workshop business users (UC grants)
    default: revantage_consumers

targets:
  dev:
    default: true
    workspace:
      profile: fevm-thhart-october-2026
      root_path: /Workspace/Users/thomas.hart@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: thhart_october_2026_catalog
      schema: revantage_20261008
      warehouse_id: 0fb3aaac7c7d373c
      experiment_path: /Users/thomas.hart@databricks.com/experiments
      genie_space_path: /Users/thomas.hart@databricks.com/spaces
      dashboard_path: /Users/thomas.hart@databricks.com/dashboards
      alerts_path: /Users/thomas.hart@databricks.com/alerts
      app_name: revantage-lease-tracker
      approvals_app_name: revantage-invoice-approvals
      workspace_id: "7474657569423450"

  # Revantage dev workspace (where participants build live). Fill in the TODOs once access is
  # granted, run preflight/preflight.py, then: bundle deploy -t revantage && bundle run setup_starting_state -t revantage
  revantage:
    workspace:
      profile: revantage-dev # TODO: `databricks auth login --host <revantage dev host> --profile revantage-dev`
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: revantage_dev # TODO: catalog where the facilitator can CREATE SCHEMA
      schema: databricks_workshop
      warehouse_id: TODO_WAREHOUSE_ID # serverless SQL warehouse
      experiment_path: /Users/${workspace.current_user.userName}/experiments
      genie_space_path: /Users/${workspace.current_user.userName}/spaces
      dashboard_path: /Users/${workspace.current_user.userName}/dashboards
      alerts_path: /Users/${workspace.current_user.userName}/alerts
      app_name: revantage-lease-tracker
      approvals_app_name: revantage-invoice-approvals
      workspace_id: "TODO_WORKSPACE_ID"
    # Demo 16 data profiling monitor. Only in this target: the FEVM metastore is at its 1,000-monitor
    # limit ("Cannot create Monitor because it exceeds the number of limit 1000"), so dev can't create it.
    resources:
      quality_monitors:
        gold_property_quarterly_monitor:
          table_name: ${var.catalog}.${var.schema}.gold_property_quarterly
          assets_dir: ${workspace.root_path}/dq-assets
          output_schema_name: ${var.catalog}.${var.schema}
          warehouse_id: ${var.warehouse_id}
          snapshot: {}
          slicing_exprs:
            - region_name

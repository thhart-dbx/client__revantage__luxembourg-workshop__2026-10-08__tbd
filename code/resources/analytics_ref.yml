# Reference solutions (answer keys) for the SQL demos: D3 migrated view, D7 metric views, D14 forecast.
#   databricks bundle run ref_analytics
resources:
  jobs:
    ref_analytics:
      name: "[Revantage workshop] Reference: D3 view, D6 checks, D7 metric views, D14 forecast, D17 business layer"
      description: Answer keys for Demos 3, 6, 7, 14, 17. Safe to re-run; replaces only ref_* objects.
      max_concurrent_runs: 1
      tasks:
        - task_key: build_refs
          spark_python_task:
            python_file: ../setup/run_sql.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${resources.schemas.demo_schema.name}
              - --bundle-root
              - ${workspace.file_path}
              - reference/d03_property_performance_v.sql
              - reference/d07_metric_views.sql
              - reference/d06_quality_checks.sql
              - reference/d17_business_layer.sql
          environment_key: default
        - task_key: build_forecast # ai_forecast runs only on a SQL warehouse
          depends_on:
            - task_key: build_refs
          spark_python_task:
            python_file: ../setup/run_sql.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${resources.schemas.demo_schema.name}
              - --bundle-root
              - ${workspace.file_path}
              - --warehouse
              - ${var.warehouse_id}
              - reference/d14_forecast.sql
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"

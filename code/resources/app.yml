# Next.js app on Databricks Apps. `bundle deploy` uploads code/app (respecting .gitignore) and
# creates the app; `bundle run demo_app` deploys and starts it. On deploy, the platform runs
# `npm install`, then `npm run build`, then the command in code/app/app.yaml.
resources:
  apps:
    demo_app:
      name: ${var.app_name}
      description: Lease Expiry Tracker (Demo 9) for the Revantage asset management team
      source_code_path: ../app
      config: # replaces app.yaml so catalog/schema come from bundle variables
        command: ["npm", "run", "start"]
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: DATABRICKS_CATALOG
            value: ${var.catalog}
          - name: DATABRICKS_SCHEMA
            value: ${resources.schemas.demo_schema.name}
      resources:
        - name: sql-warehouse # referenced from app.yaml via valueFrom
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
      # On-behalf-of-user auth: the user's token arrives in the x-forwarded-access-token header,
      # so Unity Catalog row filters/masks apply per user. A workspace admin must enable it first.
      # user_api_scopes:
      #   - sql

    approvals_app:
      name: ${var.approvals_app_name}
      description: Invoice Approvals on Lakebase (Demo 12), approve extracted invoices before they reach the GL
      source_code_path: ../app-approvals
      config:
        command: ["npm", "run", "start"]
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        # Lakebase: injects PGHOST, PGPORT, PGDATABASE, PGUSER (the app service principal), PGSSLMODE.
        - name: lakebase
          database:
            instance_name: ${resources.database_instances.lux_ops.name}
            database_name: revantage_ops
            permission: CAN_CONNECT_AND_CREATE

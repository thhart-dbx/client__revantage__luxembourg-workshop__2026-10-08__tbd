      serialized_space: "{\n  \"version\": 2,\n  \"config\": {\n    \"sample_questions\": [\n      {\n        \"id\": \"23e68ccec609844afa12fff00e853ef4\",\n        \"question\": [\n          \"Which market has the highest quarter-over-quarter net profit growth?\"\n        ]\n      },\n      {\n        \"id\": \"53653f66cc5b42714478f6bf04652bf8\",\n        \"question\": [\n          \"Show me revenue by property type as a bar chart\"\n        ]\n      },\n      {\n        \"id\": \"5cd703b41d8c3653eb698a6280280984\",\n        \"question\": [\n          \"Which properties missed their quarterly target in 2026-Q2?\"\n        ]\n      },\n      {\n        \"id\": \"5de70fac448bdd1a4c0a32132a6358ae\",\n        \"question\": [\n          \"Summarize the top 3 risks across the portfolio this quarter\"\n        ]\n      },\n      {\n        \"id\": \"c80eaac3243848b32b2d9d6a045cf2db\",\n        \"question\": [\n          \"What changed from Q1 to Q2 for the Southeast region?\"\n        ]\n      }\n    ]\n  },\n  \"data_sources\": {\n    \"tables\": [\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.bronze_properties\",\n        \"description\": [\n          \"Raw property master as extracted from the source system (bronze). Unvalidated: may contain duplicates, NULL regions, and non-standard market names.\"\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.gold_property_quarterly\",\n        \"description\": [\n          \"Certified quarterly P&L per property, 2024-Q1 to 2026-Q2, EUR. net_profit is the Finance definition (revenue - operating_expense - mgmt_fee); targets and prior-quarter comparison included.\"\n        ],\n        \"column_configs\": [\n          {\n            \"column_name\": \"met_target\",\n            \"synonyms\": [\n              \"hit target\",\n              \"on plan\",\n              \"on budget\"\n            ]\n          },\n          {\n            \"column_name\": \"net_profit\",\n            \"synonyms\": [\n              \"profit\",\n              \"NOI\",\n              \"net income\"\n            ]\n          },\n          {\n            \"column_name\": \"net_profit_target\",\n            \"synonyms\": [\n              \"target\",\n              \"budget\",\n              \"plan\"\n            ]\n          },\n          {\n            \"column_name\": \"property_name\",\n            \"synonyms\": [\n              \"property\",\n              \"asset\",\n              \"building\"\n            ]\n          },\n          {\n            \"column_name\": \"qoq_change_pct\",\n            \"synonyms\": [\n              \"quarter over quarter\",\n              \"QoQ\"\n            ]\n          },\n          {\n            \"column_name\": \"region_name\",\n            \"synonyms\": [\n              \"region\"\n            ]\n          }\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.silver_leases\",\n        \"description\": [\n          \"Current rent roll: lease start/end, monthly rent (EUR), status.\"\n        ],\n        \"column_configs\": [\n          {\n            \"column_name\": \"lease_end\",\n            \"synonyms\": [\n              \"expiry\",\n              \"expiration date\"\n            ]\n          },\n          {\n            \"column_name\": \"monthly_rent\",\n            \"synonyms\": [\n              \"rent\"\n            ]\n          }\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.silver_properties\",\n        \"description\": [\n          \"Clean property master (silver): one row per active property.\"\n        ],\n        \"column_configs\": [\n          {\n            \"column_name\": \"market\",\n            \"synonyms\": [\n              \"city\"\n            ]\n          },\n          {\n            \"column_name\": \"property_name\",\n            \"synonyms\": [\n              \"property\",\n              \"asset\"\n            ]\n          }\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.silver_tenants\",\n        \"description\": [\n          \"Tenant master: industry, credit rating, leasing contact.\"\n        ],\n        \"column_configs\": [\n          {\n            \"column_name\": \"tenant_name\",\n            \"synonyms\": [\n              \"tenant\",\n              \"customer\"\n            ]\n          }\n        ]\n      }\n    ]\n  },\n  \"instructions\": {\n    \"text_instructions\": [\n      {\n        \"id\": \"7cf232515f3a08635be23f6104e9cb75\",\n        \"content\": [\n          \"You answer questions from Revantage portfolio and asset managers about property performance.\\n- Amounts are EUR. The latest complete fiscal quarter is 2026-Q2; \\\"this quarter\\\" means 2026-Q2 and \\\"last quarter\\\" means 2026-Q1.\\n- Net profit means the Finance definition in gold_property_quarterly.net_profit: revenue - operating expense - management fees (capex and intercompany are excluded).\\n- If a question doesn't name a period, answer for 2026-Q2. Quarter-over-quarter questions without a period compare 2026-Q2 with 2026-Q1; never rank across all historical quarters unless asked.\\n- A property missed its target when met_target is false.\\n- bronze_properties is the raw source extract; silver_properties and gold_property_quarterly are the cleaned layers. Use bronze only for data-quality questions.\"\n        ]\n      }\n    ]\n  }\n}"
      permissions:
        - group_name: ${var.consumer_group}
          level: CAN_RUN
    portfolio_qa_reference:
      title: "Revantage Portfolio Q&A (Reference)"
      description: "Answer key: governed metric views, example SQL, and joins (Demo 7 step 6, Demo 8, Demo 15A)."
      parent_path: ${var.genie_space_path}
      warehouse_id: ${var.warehouse_id}
      serialized_space: "{\n  \"version\": 2,\n  \"config\": {\n    \"sample_questions\": [\n      {\n        \"id\": \"23e68ccec609844afa12fff00e853ef4\",\n        \"question\": [\n          \"Which market has the highest quarter-over-quarter net profit growth?\"\n        ]\n      },\n      {\n        \"id\": \"53653f66cc5b42714478f6bf04652bf8\",\n        \"question\": [\n          \"Show me revenue by property type as a bar chart\"\n        ]\n      },\n      {\n        \"id\": \"5cd703b41d8c3653eb698a6280280984\",\n        \"question\": [\n          \"Which properties missed their quarterly target in 2026-Q2?\"\n        ]\n      },\n      {\n        \"id\": \"5de70fac448bdd1a4c0a32132a6358ae\",\n        \"question\": [\n          \"Summarize the top 3 risks across the portfolio this quarter\"\n        ]\n      },\n      {\n        \"id\": \"c80eaac3243848b32b2d9d6a045cf2db\",\n        \"question\": [\n          \"What changed from Q1 to Q2 for the Southeast region?\"\n        ]\n      }\n    ]\n  },\n  \"data_sources\": {\n    \"tables\": [\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.bronze_properties\",\n        \"description\": [\n          \"Raw property master as extracted from the source system (bronze). Unvalidated: may contain duplicates, NULL regions, and non-standard market names.\"\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.gold_property_quarterly\",\n        \"description\": [\n          \"Certified quarterly P&L per property, 2024-Q1 to 2026-Q2, EUR. net_profit is the Finance definition (revenue - operating_expense - mgmt_fee); targets and prior-quarter comparison included.\"\n        ],\n        \"column_configs\": [\n          {\n            \"column_name\": \"met_target\",\n            \"synonyms\": [\n              \"hit target\",\n              \"on plan\",\n              \"on budget\"\n            ]\n          },\n          {\n            \"column_name\": \"net_profit\",\n            \"synonyms\": [\n              \"profit\",\n              \"NOI\",\n              \"net income\"\n            ]\n          },\n          {\n            \"column_name\": \"net_profit_target\",\n            \"synonyms\": [\n              \"target\",\n              \"budget\",\n              \"plan\"\n            ]\n          },\n          {\n            \"column_name\": \"property_name\",\n            \"synonyms\": [\n              \"property\",\n              \"asset\",\n              \"building\"\n            ]\n          },\n          {\n            \"column_name\": \"qoq_change_pct\",\n            \"synonyms\": [\n              \"quarter over quarter\",\n              \"QoQ\"\n            ]\n          },\n          {\n            \"column_name\": \"region_name\",\n            \"synonyms\": [\n              \"region\"\n            ]\n          }\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.silver_leases\",\n        \"description\": [\n          \"Current rent roll: lease start/end, monthly rent (EUR), status.\"\n        ],\n        \"column_configs\": [\n          {\n            \"column_name\": \"lease_end\",\n            \"synonyms\": [\n              \"expiry\",\n              \"expiration date\"\n            ]\n          },\n          {\n            \"column_name\": \"monthly_rent\",\n            \"synonyms\": [\n              \"rent\"\n            ]\n          }\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.silver_properties\",\n        \"description\": [\n          \"Clean property master (silver): one row per active property.\"\n        ],\n        \"column_configs\": [\n          {\n            \"column_name\": \"market\",\n            \"synonyms\": [\n              \"city\"\n            ]\n          },\n          {\n            \"column_name\": \"property_name\",\n            \"synonyms\": [\n              \"property\",\n              \"asset\"\n            ]\n          }\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.silver_tenants\",\n        \"description\": [\n          \"Tenant master: industry, credit rating, leasing contact.\"\n        ],\n        \"column_configs\": [\n          {\n            \"column_name\": \"tenant_name\",\n            \"synonyms\": [\n              \"tenant\",\n              \"customer\"\n            ]\n          }\n        ]\n      }\n    ],\n    \"metric_views\": [\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.ref_mv_net_profit_margin\",\n        \"description\": [\n          \"Approved Finance net profit and margin (+ Asset Mgmt variant).\"\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.ref_mv_qoq_revenue_growth\",\n        \"description\": [\n          \"Quarter-over-quarter revenue and net profit growth.\"\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.ref_mv_target_attainment\",\n        \"description\": [\n          \"Share of properties meeting net profit target; shortfall vs target.\"\n        ]\n      }\n    ]\n  },\n  \"instructions\": {\n    \"text_instructions\": [\n      {\n        \"id\": \"1aeede595ba04665543af6981f05008e\",\n        \"content\": [\n          \"You answer questions from Revantage portfolio and asset managers about property performance.\\n- Amounts are EUR. The latest complete fiscal quarter is 2026-Q2; \\\"this quarter\\\" means 2026-Q2 and \\\"last quarter\\\" means 2026-Q1.\\n- Net profit means the Finance definition in gold_property_quarterly.net_profit: revenue - operating expense - management fees (capex and intercompany are excluded).\\n- If a question doesn't name a period, answer for 2026-Q2. Quarter-over-quarter questions without a period compare 2026-Q2 with 2026-Q1; never rank across all historical quarters unless asked.\\n- A property missed its target when met_target is false.\\n- bronze_properties is the raw source extract; silver_properties and gold_property_quarterly are the cleaned layers. Use bronze only for data-quality questions.\\n- Prefer the governed metric views for KPIs: ref_mv_net_profit_margin (net profit, margin, and the non-approved Asset Management variant), ref_mv_target_attainment (share of properties meeting target, net_profit_vs_target), ref_mv_qoq_revenue_growth (QoQ growth). Say which metric view and definition you used.\\n- The Asset Management net profit (also subtracts capex) is not the approved definition. Only show it when asked to compare definitions, and label it.\\n- When explaining a change, break it down by property and by component (revenue, operating expense, management fee) and name the largest drivers. Compute totals and percentages in SQL, never by hand.\\n- For risks, consider: missed targets, quarter-over-quarter declines, leases expiring within 180 days (silver_leases.lease_end vs current_date()), and tenants rated below BB.\"\n        ]\n      }\n    ],\n    \"example_question_sqls\": [\n      {\n        \"id\": \"23e68ccec609844afa12fff00e853ef4\",\n        \"question\": [\n          \"Which market has the highest quarter-over-quarter net profit growth?\"\n        ],\n        \"sql\": [\n          \"SELECT market, MEASURE(qoq_net_profit_growth) AS qoq_net_profit_growth\\nFROM ${var.catalog}.${var.schema}.ref_mv_qoq_revenue_growth\\nWHERE fiscal_quarter = '2026-Q2'\\nGROUP BY market\\nORDER BY qoq_net_profit_growth DESC\"\n        ]\n      },\n      {\n        \"id\": \"4637bb70c12fd1df0134326887a8f444\",\n        \"question\": [\n          \"Why did Southeast net profit drop in Q2?\"\n        ],\n        \"sql\": [\n          \"SELECT q2.property_name,\\n  q2.net_profit - q1.net_profit AS net_profit_change,\\n  q2.revenue - q1.revenue AS revenue_change,\\n  q2.operating_expense - q1.operating_expense AS opex_change,\\n  q2.mgmt_fee - q1.mgmt_fee AS mgmt_fee_change\\nFROM ${var.catalog}.${var.schema}.gold_property_quarterly q2\\nJOIN ${var.catalog}.${var.schema}.gold_property_quarterly q1 ON q1.property_id = q2.property_id AND q1.fiscal_quarter = '2026-Q1'\\nWHERE q2.fiscal_quarter = '2026-Q2' AND q2.region_name = 'Southeast'\\nORDER BY net_profit_change\"\n        ]\n      },\n      {\n        \"id\": \"5cd703b41d8c3653eb698a6280280984\",\n        \"question\": [\n          \"Which properties missed their quarterly target in 2026-Q2?\"\n        ],\n        \"sql\": [\n          \"SELECT property_name, MEASURE(net_profit_vs_target) AS net_profit_vs_target\\nFROM ${var.catalog}.${var.schema}.ref_mv_target_attainment\\nWHERE fiscal_quarter = '2026-Q2'\\nGROUP BY property_name\\nHAVING MEASURE(net_profit_vs_target) < 0\\nORDER BY net_profit_vs_target\"\n        ]\n      },\n      {\n        \"id\": \"a920515ffdae4adb429a753c127f4bbc\",\n        \"question\": [\n          \"What is our net profit margin this quarter?\"\n        ],\n        \"sql\": [\n          \"SELECT MEASURE(net_profit) AS net_profit, MEASURE(revenue) AS revenue, MEASURE(net_profit_margin) AS net_profit_margin\\nFROM ${var.catalog}.${var.schema}.ref_mv_net_profit_margin\\nWHERE fiscal_quarter = '2026-Q2'\"\n        ]\n      }\n    ],\n    \"join_specs\": [\n      {\n        \"id\": \"173f9b0d301470b2cc373cd94a054ec5\",\n        \"left\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.gold_property_quarterly\",\n          \"alias\": \"gold_property_quarterly\"\n        },\n        \"right\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.silver_properties\",\n          \"alias\": \"silver_properties\"\n        },\n        \"sql\": [\n          \"`gold_property_quarterly`.`property_id` = `silver_properties`.`property_id`\",\n          \"--rt=FROM_RELATIONSHIP_TYPE_MANY_TO_ONE--\"\n        ]\n      },\n      {\n        \"id\": \"938caad96afef4eb40f722f064b3bc84\",\n        \"left\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.silver_leases\",\n          \"alias\": \"silver_leases\"\n        },\n        \"right\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.silver_properties\",\n          \"alias\": \"silver_properties\"\n        },\n        \"sql\": [\n          \"`silver_leases`.`property_id` = `silver_properties`.`property_id`\",\n          \"--rt=FROM_RELATIONSHIP_TYPE_MANY_TO_ONE--\"\n        ]\n      },\n      {\n        \"id\": \"c1172345b79b90b094cbfcee4ab11ffd\",\n        \"left\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.silver_leases\",\n          \"alias\": \"silver_leases\"\n        },\n        \"right\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.silver_tenants\",\n          \"alias\": \"silver_tenants\"\n        },\n        \"sql\": [\n          \"`silver_leases`.`tenant_id` = `silver_tenants`.`tenant_id`\",\n          \"--rt=FROM_RELATIONSHIP_TYPE_MANY_TO_ONE--\"\n        ]\n      }\n    ]\n  }\n}"
      permissions:
        - group_name: ${var.consumer_group}
          level: CAN_RUN

# Generated by code/genie/build_spaces.py: edit the specs there, then re-run it.
resources:
  genie_spaces:
    portfolio_qa_start:
      title: "Revantage Portfolio Q&A (Start)"
      description: "Day 1 Genie One space: property performance Q&A and data-quality exploration (Demos 2, 6)."
      parent_path: ${var.genie_space_path}
      warehouse_id: ${var.warehouse_id}
      serialized_space: "{\n  \"version\": 2,\n  \"config\": {\n    \"sample_questions\": [\n      {\n        \"id\": \"23e68ccec609844afa12fff00e853ef4\",\n        \"question\": [\n          \"Which market has the highest quarter-over-quarter net profit growth?\"\n        ]\n      },\n      {\n        \"id\": \"53653f66cc5b42714478f6bf04652bf8\",\n        \"question\": [\n          \"Show me revenue by property type as a bar chart\"\n        ]\n      },\n      {\n        \"id\": \"5cd703b41d8c3653eb698a6280280984\",\n        \"question\": [\n          \"Which properties missed their quarterly target in 2026-Q2?\"\n        ]\n      },\n      {\n        \"id\": \"5de70fac448bdd1a4c0a32132a6358ae\",\n        \"question\": [\n          \"Summarize the top 3 risks across the portfolio this quarter\"\n        ]\n      },\n      {\n        \"id\": \"c80eaac3243848b32b2d9d6a045cf2db\",\n        \"question\": [\n          \"What changed from Q1 to Q2 for the Southeast region?\"\n        ]\n      }\n    ]\n  },\n  \"data_sources\": {\n    \"tables\": [\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.bronze_properties\",\n        \"description\": [\n          \"Raw property master as extracted from the source system (bronze). Unvalidated: may contain duplicates, NULL regions, and non-standard market names.\"\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.gold_property_quarterly\",\n        \"description\": [\n          \"Certified quarterly P&L per property, 2024-Q1 to 2026-Q2, EUR. net_profit is the Finance definition (revenue - operating_expense - mgmt_fee); targets and prior-quarter comparison included.\"\n        ],\n        \"column_configs\": [\n          {\n            \"column_name\": \"met_target\",\n            \"synonyms\": [\n              \"hit target\",\n              \"on plan\",\n              \"on budget\"\n            ]\n          },\n          {\n            \"column_name\": \"net_profit\",\n            \"synonyms\": [\n              \"profit\",\n              \"NOI\",\n              \"net income\"\n            ]\n          },\n          {\n            \"column_name\": \"net_profit_target\",\n            \"synonyms\": [\n              \"target\",\n              \"budget\",\n              \"plan\"\n            ]\n          },\n          {\n            \"column_name\": \"property_name\",\n            \"synonyms\": [\n              \"property\",\n              \"asset\",\n              \"building\"\n            ]\n          },\n          {\n            \"column_name\": \"qoq_change_pct\",\n            \"synonyms\": [\n              \"quarter over quarter\",\n              \"QoQ\"\n            ]\n          },\n          {\n            \"column_name\": \"region_name\",\n            \"synonyms\": [\n              \"region\"\n            ]\n          }\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.silver_leases\",\n        \"description\": [\n          \"Current rent roll: lease start/end, monthly rent (EUR), status.\"\n        ],\n        \"column_configs\": [\n          {\n            \"column_name\": \"lease_end\",\n            \"synonyms\": [\n              \"expiry\",\n              \"expiration date\"\n            ]\n          },\n          {\n            \"column_name\": \"monthly_rent\",\n            \"synonyms\": [\n              \"rent\"\n            ]\n          }\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.silver_properties\",\n        \"description\": [\n          \"Clean property master (silver): one row per active property.\"\n        ],\n        \"column_configs\": [\n          {\n            \"column_name\": \"market\",\n            \"synonyms\": [\n              \"city\"\n            ]\n          },\n          {\n            \"column_name\": \"property_name\",\n            \"synonyms\": [\n              \"property\",\n              \"asset\"\n            ]\n          }\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.silver_tenants\",\n        \"description\": [\n          \"Tenant master: industry, credit rating, leasing contact.\"\n        ],\n        \"column_configs\": [\n          {\n            \"column_name\": \"tenant_name\",\n            \"synonyms\": [\n              \"tenant\",\n              \"customer\"\n            ]\n          }\n        ]\n      }\n    ]\n  },\n  \"instructions\": {\n    \"text_instructions\": [\n      {\n        \"id\": \"7cf232515f3a08635be23f6104e9cb75\",\n        \"content\": [\n          \"You answer questions from Revantage portfolio and asset managers about property performance.\\n- Amounts are EUR. The latest complete fiscal quarter is 2026-Q2; \\\"this quarter\\\" means 2026-Q2 and \\\"last quarter\\\" means 2026-Q1.\\n- Net profit means the Finance definition in gold_property_quarterly.net_profit: revenue - operating expense - management fees (capex and intercompany are excluded).\\n- If a question doesn't name a period, answer for 2026-Q2. Quarter-over-quarter questions without a period compare 2026-Q2 with 2026-Q1; never rank across all historical quarters unless asked.\\n- A property missed its target when met_target is false.\\n- bronze_properties is the raw source extract; silver_properties and gold_property_quarterly are the cleaned layers. Use bronze only for data-quality questions.\"\n        ]\n      }\n    ]\n  }\n}"
      permissions:
        - group_name: ${var.consumer_group}
          level: CAN_RUN
    portfolio_qa_reference:
      title: "Revantage Portfolio Q&A (Reference)"
      description: "Answer key: governed metric views, example SQL, and joins (Demo 7 step 6, Demo 8, Demo 15A)."
      parent_path: ${var.genie_space_path}
      warehouse_id: ${var.warehouse_id}
      serialized_space: "{\n  \"version\": 2,\n  \"config\": {\n    \"sample_questions\": [\n      {\n        \"id\": \"23e68ccec609844afa12fff00e853ef4\",\n        \"question\": [\n          \"Which market has the highest quarter-over-quarter net profit growth?\"\n        ]\n      },\n      {\n        \"id\": \"53653f66cc5b42714478f6bf04652bf8\",\n        \"question\": [\n          \"Show me revenue by property type as a bar chart\"\n        ]\n      },\n      {\n        \"id\": \"5cd703b41d8c3653eb698a6280280984\",\n        \"question\": [\n          \"Which properties missed their quarterly target in 2026-Q2?\"\n        ]\n      },\n      {\n        \"id\": \"5de70fac448bdd1a4c0a32132a6358ae\",\n        \"question\": [\n          \"Summarize the top 3 risks across the portfolio this quarter\"\n        ]\n      },\n      {\n        \"id\": \"c80eaac3243848b32b2d9d6a045cf2db\",\n        \"question\": [\n          \"What changed from Q1 to Q2 for the Southeast region?\"\n        ]\n      }\n    ]\n  },\n  \"data_sources\": {\n    \"tables\": [\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.bronze_properties\",\n        \"description\": [\n          \"Raw property master as extracted from the source system (bronze). Unvalidated: may contain duplicates, NULL regions, and non-standard market names.\"\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.gold_property_quarterly\",\n        \"description\": [\n          \"Certified quarterly P&L per property, 2024-Q1 to 2026-Q2, EUR. net_profit is the Finance definition (revenue - operating_expense - mgmt_fee); targets and prior-quarter comparison included.\"\n        ],\n        \"column_configs\": [\n          {\n            \"column_name\": \"met_target\",\n            \"synonyms\": [\n              \"hit target\",\n              \"on plan\",\n              \"on budget\"\n            ]\n          },\n          {\n            \"column_name\": \"net_profit\",\n            \"synonyms\": [\n              \"profit\",\n              \"NOI\",\n              \"net income\"\n            ]\n          },\n          {\n            \"column_name\": \"net_profit_target\",\n            \"synonyms\": [\n              \"target\",\n              \"budget\",\n              \"plan\"\n            ]\n          },\n          {\n            \"column_name\": \"property_name\",\n            \"synonyms\": [\n              \"property\",\n              \"asset\",\n              \"building\"\n            ]\n          },\n          {\n            \"column_name\": \"qoq_change_pct\",\n            \"synonyms\": [\n              \"quarter over quarter\",\n              \"QoQ\"\n            ]\n          },\n          {\n            \"column_name\": \"region_name\",\n            \"synonyms\": [\n              \"region\"\n            ]\n          }\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.silver_leases\",\n        \"description\": [\n          \"Current rent roll: lease start/end, monthly rent (EUR), status.\"\n        ],\n        \"column_configs\": [\n          {\n            \"column_name\": \"lease_end\",\n            \"synonyms\": [\n              \"expiry\",\n              \"expiration date\"\n            ]\n          },\n          {\n            \"column_name\": \"monthly_rent\",\n            \"synonyms\": [\n              \"rent\"\n            ]\n          }\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.silver_properties\",\n        \"description\": [\n          \"Clean property master (silver): one row per active property.\"\n        ],\n        \"column_configs\": [\n          {\n            \"column_name\": \"market\",\n            \"synonyms\": [\n              \"city\"\n            ]\n          },\n          {\n            \"column_name\": \"property_name\",\n            \"synonyms\": [\n              \"property\",\n              \"asset\"\n            ]\n          }\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.silver_tenants\",\n        \"description\": [\n          \"Tenant master: industry, credit rating, leasing contact.\"\n        ],\n        \"column_configs\": [\n          {\n            \"column_name\": \"tenant_name\",\n            \"synonyms\": [\n              \"tenant\",\n              \"customer\"\n            ]\n          }\n        ]\n      }\n    ],\n    \"metric_views\": [\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.ref_mv_net_profit_margin\",\n        \"description\": [\n          \"Approved Finance net profit and margin (+ Asset Mgmt variant).\"\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.ref_mv_qoq_revenue_growth\",\n        \"description\": [\n          \"Quarter-over-quarter revenue and net profit growth.\"\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.ref_mv_target_attainment\",\n        \"description\": [\n          \"Share of properties meeting net profit target; shortfall vs target.\"\n        ]\n      }\n    ]\n  },\n  \"instructions\": {\n    \"text_instructions\": [\n      {\n        \"id\": \"1aeede595ba04665543af6981f05008e\",\n        \"content\": [\n          \"You answer questions from Revantage portfolio and asset managers about property performance.\\n- Amounts are EUR. The latest complete fiscal quarter is 2026-Q2; \\\"this quarter\\\" means 2026-Q2 and \\\"last quarter\\\" means 2026-Q1.\\n- Net profit means the Finance definition in gold_property_quarterly.net_profit: revenue - operating expense - management fees (capex and intercompany are excluded).\\n- If a question doesn't name a period, answer for 2026-Q2. Quarter-over-quarter questions without a period compare 2026-Q2 with 2026-Q1; never rank across all historical quarters unless asked.\\n- A property missed its target when met_target is false.\\n- bronze_properties is the raw source extract; silver_properties and gold_property_quarterly are the cleaned layers. Use bronze only for data-quality questions.\\n- Prefer the governed metric views for KPIs: ref_mv_net_profit_margin (net profit, margin, and the non-approved Asset Management variant), ref_mv_target_attainment (share of properties meeting target, net_profit_vs_target), ref_mv_qoq_revenue_growth (QoQ growth). Say which metric view and definition you used.\\n- The Asset Management net profit (also subtracts capex) is not the approved definition. Only show it when asked to compare definitions, and label it.\\n- When explaining a change, break it down by property and by component (revenue, operating expense, management fee) and name the largest drivers. Compute totals and percentages in SQL, never by hand.\\n- For risks, consider: missed targets, quarter-over-quarter declines, leases expiring within 180 days (silver_leases.lease_end vs current_date()), and tenants rated below BB.\"\n        ]\n      }\n    ],\n    \"example_question_sqls\": [\n      {\n        \"id\": \"23e68ccec609844afa12fff00e853ef4\",\n        \"question\": [\n          \"Which market has the highest quarter-over-quarter net profit growth?\"\n        ],\n        \"sql\": [\n          \"SELECT market, MEASURE(qoq_net_profit_growth) AS qoq_net_profit_growth\\nFROM ${var.catalog}.${var.schema}.ref_mv_qoq_revenue_growth\\nWHERE fiscal_quarter = '2026-Q2'\\nGROUP BY market\\nORDER BY qoq_net_profit_growth DESC\"\n        ]\n      },\n      {\n        \"id\": \"4637bb70c12fd1df0134326887a8f444\",\n        \"question\": [\n          \"Why did Southeast net profit drop in Q2?\"\n        ],\n        \"sql\": [\n          \"SELECT q2.property_name,\\n  q2.net_profit - q1.net_profit AS net_profit_change,\\n  q2.revenue - q1.revenue AS revenue_change,\\n  q2.operating_expense - q1.operating_expense AS opex_change,\\n  q2.mgmt_fee - q1.mgmt_fee AS mgmt_fee_change\\nFROM ${var.catalog}.${var.schema}.gold_property_quarterly q2\\nJOIN ${var.catalog}.${var.schema}.gold_property_quarterly q1 ON q1.property_id = q2.property_id AND q1.fiscal_quarter = '2026-Q1'\\nWHERE q2.fiscal_quarter = '2026-Q2' AND q2.region_name = 'Southeast'\\nORDER BY net_profit_change\"\n        ]\n      },\n      {\n        \"id\": \"5cd703b41d8c3653eb698a6280280984\",\n        \"question\": [\n          \"Which properties missed their quarterly target in 2026-Q2?\"\n        ],\n        \"sql\": [\n          \"SELECT property_name, MEASURE(net_profit_vs_target) AS net_profit_vs_target\\nFROM ${var.catalog}.${var.schema}.ref_mv_target_attainment\\nWHERE fiscal_quarter = '2026-Q2'\\nGROUP BY property_name\\nHAVING MEASURE(net_profit_vs_target) < 0\\nORDER BY net_profit_vs_target\"\n        ]\n      },\n      {\n        \"id\": \"a920515ffdae4adb429a753c127f4bbc\",\n        \"question\": [\n          \"What is our net profit margin this quarter?\"\n        ],\n        \"sql\": [\n          \"SELECT MEASURE(net_profit) AS net_profit, MEASURE(revenue) AS revenue, MEASURE(net_profit_margin) AS net_profit_margin\\nFROM ${var.catalog}.${var.schema}.ref_mv_net_profit_margin\\nWHERE fiscal_quarter = '2026-Q2'\"\n        ]\n      }\n    ],\n    \"join_specs\": [\n      {\n        \"id\": \"173f9b0d301470b2cc373cd94a054ec5\",\n        \"left\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.gold_property_quarterly\",\n          \"alias\": \"gold_property_quarterly\"\n        },\n        \"right\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.silver_properties\",\n          \"alias\": \"silver_properties\"\n        },\n        \"sql\": [\n          \"`gold_property_quarterly`.`property_id` = `silver_properties`.`property_id`\",\n          \"--rt=FROM_RELATIONSHIP_TYPE_MANY_TO_ONE--\"\n        ]\n      },\n      {\n        \"id\": \"938caad96afef4eb40f722f064b3bc84\",\n        \"left\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.silver_leases\",\n          \"alias\": \"silver_leases\"\n        },\n        \"right\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.silver_properties\",\n          \"alias\": \"silver_properties\"\n        },\n        \"sql\": [\n          \"`silver_leases`.`property_id` = `silver_properties`.`property_id`\",\n          \"--rt=FROM_RELATIONSHIP_TYPE_MANY_TO_ONE--\"\n        ]\n      },\n      {\n        \"id\": \"c1172345b79b90b094cbfcee4ab11ffd\",\n        \"left\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.silver_leases\",\n          \"alias\": \"silver_leases\"\n        },\n        \"right\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.silver_tenants\",\n          \"alias\": \"silver_tenants\"\n        },\n        \"sql\": [\n          \"`silver_leases`.`tenant_id` = `silver_tenants`.`tenant_id`\",\n          \"--rt=FROM_RELATIONSHIP_TYPE_MANY_TO_ONE--\"\n        ]\n      }\n    ]\n  }\n}"
      permissions:
        - group_name: ${var.consumer_group}
          level: CAN_RUN
    accuracy_lab_start:
      title: "Revantage Accuracy Lab (Start)"
      description: "Demo 17 starting point: the legacy tables only (rung R1) with the 10-question benchmark. Clone it, then add one metadata layer at a time and re-run the benchmarks."
      parent_path: ${var.genie_space_path}
      warehouse_id: ${var.warehouse_id}
      serialized_space: "{\n  \"version\": 2,\n  \"config\": {\n    \"sample_questions\": []\n  },\n  \"data_sources\": {\n    \"tables\": [\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.legacy_gl_acct\"\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.legacy_gl_txn\"\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.legacy_lse\"\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.legacy_prp_mstr\"\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.legacy_qtr_tgt\"\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.legacy_tnt\"\n      }\n    ]\n  },\n  \"benchmarks\": {\n    \"questions\": [\n      {\n        \"id\": \"042cac6fc38283ed4a9e40e72de6fb5e\",\n        \"question\": [\n          \"Which tenants rated below investment grade have active leases?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"SELECT DISTINCT n.TNT_NM AS tenant_name FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY LSE_ID ORDER BY UPD_DT DESC) AS rn FROM ${var.catalog}.${var.schema}.legacy_lse) l JOIN ${var.catalog}.${var.schema}.legacy_tnt n ON n.TNT_ID = l.TNT_ID WHERE l.rn = 1 AND l.LSE_STS_CD = 'A' AND n.CR_RTG IN ('BB', 'B')\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"12d42a2026e42a7244df8358db8977fd\",\n        \"question\": [\n          \"What is our net profit margin this quarter?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"SELECT SUM(CASE a.ACCT_CLS_CD WHEN 'R' THEN t.AMT WHEN 'O' THEN -t.AMT WHEN 'M' THEN -t.AMT ELSE 0 END) / SUM(CASE WHEN a.ACCT_CLS_CD = 'R' THEN t.AMT ELSE 0 END) AS net_profit_margin FROM ${var.catalog}.${var.schema}.legacy_gl_txn t JOIN ${var.catalog}.${var.schema}.legacy_gl_acct a ON a.ACCT_ID = t.ACCT_ID WHERE t.FSCL_PRD = '2026-Q2'\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"488b3b681007b130fd1d97cd178523a6\",\n        \"question\": [\n          \"Show net profit by region for 2026-Q2.\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"SELECT p.RGN_NM AS region_name, SUM(CASE a.ACCT_CLS_CD WHEN 'R' THEN t.AMT WHEN 'O' THEN -t.AMT WHEN 'M' THEN -t.AMT ELSE 0 END) AS net_profit FROM ${var.catalog}.${var.schema}.legacy_gl_txn t JOIN ${var.catalog}.${var.schema}.legacy_gl_acct a ON a.ACCT_ID = t.ACCT_ID JOIN ${var.catalog}.${var.schema}.legacy_prp_mstr p ON p.PRP_ID = t.PRP_ID WHERE t.FSCL_PRD = '2026-Q2' GROUP BY p.RGN_NM\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"6e3bc0b6b9d1b726cc3d359f3215fb3e\",\n        \"question\": [\n          \"What share of properties met their net profit target in 2026-Q2?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"WITH np AS (SELECT t.PRP_ID, SUM(CASE a.ACCT_CLS_CD WHEN 'R' THEN t.AMT WHEN 'O' THEN -t.AMT WHEN 'M' THEN -t.AMT ELSE 0 END) AS net_profit FROM ${var.catalog}.${var.schema}.legacy_gl_txn t JOIN ${var.catalog}.${var.schema}.legacy_gl_acct a ON a.ACCT_ID = t.ACCT_ID WHERE t.FSCL_PRD = '2026-Q2' GROUP BY t.PRP_ID) SELECT AVG(CASE WHEN np.net_profit >= g.NP_TGT_AMT THEN 1.0 ELSE 0.0 END) AS share_met_target FROM np JOIN ${var.catalog}.${var.schema}.legacy_qtr_tgt g ON g.PRP_ID = np.PRP_ID AND g.FSCL_QTR = '2026-Q2'\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"809a34d0837bc257575a8348b64b2910\",\n        \"question\": [\n          \"How many active leases do we have?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"SELECT COUNT(*) AS active_leases FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY LSE_ID ORDER BY UPD_DT DESC) AS rn FROM ${var.catalog}.${var.schema}.legacy_lse) WHERE rn = 1 AND LSE_STS_CD = 'A'\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"93502226bf515afe4a1a6ac27710585e\",\n        \"question\": [\n          \"Which properties missed their net profit target in 2026-Q2?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"WITH np AS (SELECT t.PRP_ID, SUM(CASE a.ACCT_CLS_CD WHEN 'R' THEN t.AMT WHEN 'O' THEN -t.AMT WHEN 'M' THEN -t.AMT ELSE 0 END) AS net_profit FROM ${var.catalog}.${var.schema}.legacy_gl_txn t JOIN ${var.catalog}.${var.schema}.legacy_gl_acct a ON a.ACCT_ID = t.ACCT_ID WHERE t.FSCL_PRD = '2026-Q2' GROUP BY t.PRP_ID) SELECT p.PRP_NM AS property_name FROM np JOIN ${var.catalog}.${var.schema}.legacy_qtr_tgt g ON g.PRP_ID = np.PRP_ID AND g.FSCL_QTR = '2026-Q2' JOIN ${var.catalog}.${var.schema}.legacy_prp_mstr p ON p.PRP_ID = np.PRP_ID WHERE np.net_profit < g.NP_TGT_AMT\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"b2c0b6b96c8b1af07466198a5af3c2de\",\n        \"question\": [\n          \"What was total net profit in 2026-Q2?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"SELECT SUM(CASE a.ACCT_CLS_CD WHEN 'R' THEN t.AMT WHEN 'O' THEN -t.AMT WHEN 'M' THEN -t.AMT ELSE 0 END) AS net_profit FROM ${var.catalog}.${var.schema}.legacy_gl_txn t JOIN ${var.catalog}.${var.schema}.legacy_gl_acct a ON a.ACCT_ID = t.ACCT_ID WHERE t.FSCL_PRD = '2026-Q2'\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"dba254a7f6e27f7e1158728f140d8750\",\n        \"question\": [\n          \"How much CapEx did we spend in 2026-Q2?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"SELECT SUM(t.AMT) AS capex FROM ${var.catalog}.${var.schema}.legacy_gl_txn t JOIN ${var.catalog}.${var.schema}.legacy_gl_acct a ON a.ACCT_ID = t.ACCT_ID WHERE t.FSCL_PRD = '2026-Q2' AND a.ACCT_CLS_CD = 'C'\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"e71e90e2247ce7c716146ef7157d51c5\",\n        \"question\": [\n          \"What was total revenue of our office properties in 2026-Q2?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"SELECT SUM(t.AMT) AS revenue FROM ${var.catalog}.${var.schema}.legacy_gl_txn t JOIN ${var.catalog}.${var.schema}.legacy_gl_acct a ON a.ACCT_ID = t.ACCT_ID JOIN ${var.catalog}.${var.schema}.legacy_prp_mstr p ON p.PRP_ID = t.PRP_ID WHERE t.FSCL_PRD = '2026-Q2' AND a.ACCT_CLS_CD = 'R' AND p.PRP_TYP_CD = 'OFF'\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"efb17c93288969538eaa7d8b6a722c34\",\n        \"question\": [\n          \"What is the total monthly rent of our active leases?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"SELECT SUM(MTH_RNT_AMT) AS monthly_rent FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY LSE_ID ORDER BY UPD_DT DESC) AS rn FROM ${var.catalog}.${var.schema}.legacy_lse) WHERE rn = 1 AND LSE_STS_CD = 'A'\"\n            ]\n          }\n        ]\n      }\n    ]\n  }\n}"
      permissions:
        - group_name: ${var.consumer_group}
          level: CAN_RUN
    accuracy_lab_reference:
      title: "Revantage Accuracy Lab (Reference)"
      description: "Demo 17 answer key (rung R7): documented ref_d17_* tables, metric views, instructions, SQL examples, synonyms and joins, with the same benchmark."
      parent_path: ${var.genie_space_path}
      warehouse_id: ${var.warehouse_id}
      serialized_space: "{\n  \"version\": 2,\n  \"config\": {\n    \"sample_questions\": []\n  },\n  \"data_sources\": {\n    \"tables\": [\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.ref_d17_gl_accounts\"\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.ref_d17_gl_transactions\"\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.ref_d17_leases\",\n        \"column_configs\": [\n          {\n            \"column_name\": \"lease_end\",\n            \"synonyms\": [\n              \"expiry\",\n              \"expiration date\"\n            ]\n          },\n          {\n            \"column_name\": \"monthly_rent\",\n            \"synonyms\": [\n              \"rent\"\n            ]\n          }\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.ref_d17_properties\",\n        \"column_configs\": [\n          {\n            \"column_name\": \"property_name\",\n            \"synonyms\": [\n              \"property\",\n              \"asset\",\n              \"building\"\n            ]\n          },\n          {\n            \"column_name\": \"region_name\",\n            \"synonyms\": [\n              \"region\"\n            ]\n          }\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.ref_d17_quarterly_targets\",\n        \"column_configs\": [\n          {\n            \"column_name\": \"net_profit_target\",\n            \"synonyms\": [\n              \"target\",\n              \"budget\",\n              \"plan\"\n            ]\n          }\n        ]\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.ref_d17_tenants\",\n        \"column_configs\": [\n          {\n            \"column_name\": \"credit_rating\",\n            \"synonyms\": [\n              \"rating\"\n            ]\n          },\n          {\n            \"column_name\": \"tenant_name\",\n            \"synonyms\": [\n              \"tenant\",\n              \"customer\"\n            ]\n          }\n        ]\n      }\n    ],\n    \"metric_views\": [\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.ref_mv_net_profit_margin\"\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.ref_mv_qoq_revenue_growth\"\n      },\n      {\n        \"identifier\": \"${var.catalog}.${var.schema}.ref_mv_target_attainment\"\n      }\n    ]\n  },\n  \"instructions\": {\n    \"text_instructions\": [\n      {\n        \"id\": \"804b382f38cb8a678cfa57d607475acc\",\n        \"content\": [\n          \"You answer questions from Revantage finance and asset managers about the property portfolio.\\n- Amounts are EUR. The latest complete fiscal quarter is 2026-Q2: \\\"this quarter\\\" means 2026-Q2 and \\\"last quarter\\\" means 2026-Q1. Never use the calendar date to pick a quarter.\\n- Net profit (approved Finance definition) = revenue (account_class R) - operating expense (O) - management fee (M). CapEx (C) and intercompany recharges (I) are NOT deducted. Prefer the metric view ref_mv_net_profit_margin for net profit, revenue and margin.\\n- A property met its target when its net profit >= net_profit_target for that quarter. \\\"Share of properties that met target\\\" is the count of properties meeting target divided by all properties (ref_mv_target_attainment).\\n- ref_d17_leases keeps every version of a lease. Always use only the latest version per lease_id (highest updated_at) before counting or summing. Active means lease_status = 'A' (P = Pending Renewal, X = Expired).\\n- Property type codes: OFF = Office, MFH = Multifamily, RTL = Retail.\\n- Credit ratings from best to worst: AAA, AA, A, BBB, BB, B. \\\"Below investment grade\\\" means BB or B.\"\n        ]\n      }\n    ],\n    \"example_question_sqls\": [\n      {\n        \"id\": \"1749a7957313a1ab5c432a39e3e6555d\",\n        \"question\": [\n          \"What was net profit by property in 2026-Q1?\"\n        ],\n        \"sql\": [\n          \"SELECT p.property_name,\\n  SUM(CASE a.account_class WHEN 'R' THEN t.amount WHEN 'O' THEN -t.amount WHEN 'M' THEN -t.amount ELSE 0 END) AS net_profit\\nFROM ${var.catalog}.${var.schema}.ref_d17_gl_transactions t\\nJOIN ${var.catalog}.${var.schema}.ref_d17_gl_accounts a ON a.account_id = t.account_id\\nJOIN ${var.catalog}.${var.schema}.ref_d17_properties p ON p.property_id = t.property_id\\nWHERE t.fiscal_quarter = '2026-Q1'\\nGROUP BY p.property_name\"\n        ]\n      },\n      {\n        \"id\": \"1e3027e113ebf96594d6c0431f716282\",\n        \"question\": [\n          \"How many leases are pending renewal per property?\"\n        ],\n        \"sql\": [\n          \"WITH current_leases AS (\\n  SELECT * FROM ${var.catalog}.${var.schema}.ref_d17_leases\\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY lease_id ORDER BY updated_at DESC) = 1)\\nSELECT p.property_name, COUNT(*) AS pending_renewal\\nFROM current_leases l JOIN ${var.catalog}.${var.schema}.ref_d17_properties p ON p.property_id = l.property_id\\nWHERE l.lease_status = 'P'\\nGROUP BY p.property_name\"\n        ]\n      },\n      {\n        \"id\": \"2f14ea55c19894992e5300d1e9368828\",\n        \"question\": [\n          \"Which properties beat their net profit target last quarter?\"\n        ],\n        \"sql\": [\n          \"SELECT property_name, MEASURE(net_profit_vs_target) AS net_profit_vs_target\\nFROM ${var.catalog}.${var.schema}.ref_mv_target_attainment\\nWHERE fiscal_quarter = '2026-Q1'\\nGROUP BY property_name\\nHAVING MEASURE(net_profit_vs_target) >= 0\"\n        ]\n      }\n    ],\n    \"join_specs\": [\n      {\n        \"id\": \"19427595d0e774b63d5dbf72fe3ef9d5\",\n        \"left\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.ref_d17_gl_transactions\",\n          \"alias\": \"ref_d17_gl_transactions\"\n        },\n        \"right\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.ref_d17_properties\",\n          \"alias\": \"ref_d17_properties\"\n        },\n        \"sql\": [\n          \"`ref_d17_gl_transactions`.`property_id` = `ref_d17_properties`.`property_id`\",\n          \"--rt=FROM_RELATIONSHIP_TYPE_MANY_TO_ONE--\"\n        ]\n      },\n      {\n        \"id\": \"1d0e1c53b86cbaa559506ac7ff3cad94\",\n        \"left\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.ref_d17_leases\",\n          \"alias\": \"ref_d17_leases\"\n        },\n        \"right\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.ref_d17_properties\",\n          \"alias\": \"ref_d17_properties\"\n        },\n        \"sql\": [\n          \"`ref_d17_leases`.`property_id` = `ref_d17_properties`.`property_id`\",\n          \"--rt=FROM_RELATIONSHIP_TYPE_MANY_TO_ONE--\"\n        ]\n      },\n      {\n        \"id\": \"7f6827aff1320a1bea49c619605d08ca\",\n        \"left\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.ref_d17_gl_transactions\",\n          \"alias\": \"ref_d17_gl_transactions\"\n        },\n        \"right\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.ref_d17_gl_accounts\",\n          \"alias\": \"ref_d17_gl_accounts\"\n        },\n        \"sql\": [\n          \"`ref_d17_gl_transactions`.`account_id` = `ref_d17_gl_accounts`.`account_id`\",\n          \"--rt=FROM_RELATIONSHIP_TYPE_MANY_TO_ONE--\"\n        ]\n      },\n      {\n        \"id\": \"c564440a8f56548dce8fce00687421fe\",\n        \"left\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.ref_d17_quarterly_targets\",\n          \"alias\": \"ref_d17_quarterly_targets\"\n        },\n        \"right\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.ref_d17_properties\",\n          \"alias\": \"ref_d17_properties\"\n        },\n        \"sql\": [\n          \"`ref_d17_quarterly_targets`.`property_id` = `ref_d17_properties`.`property_id`\",\n          \"--rt=FROM_RELATIONSHIP_TYPE_MANY_TO_ONE--\"\n        ]\n      },\n      {\n        \"id\": \"e0e0e6cd36d635d717551d1615c1638d\",\n        \"left\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.ref_d17_leases\",\n          \"alias\": \"ref_d17_leases\"\n        },\n        \"right\": {\n          \"identifier\": \"${var.catalog}.${var.schema}.ref_d17_tenants\",\n          \"alias\": \"ref_d17_tenants\"\n        },\n        \"sql\": [\n          \"`ref_d17_leases`.`tenant_id` = `ref_d17_tenants`.`tenant_id`\",\n          \"--rt=FROM_RELATIONSHIP_TYPE_MANY_TO_ONE--\"\n        ]\n      }\n    ]\n  },\n  \"benchmarks\": {\n    \"questions\": [\n      {\n        \"id\": \"042cac6fc38283ed4a9e40e72de6fb5e\",\n        \"question\": [\n          \"Which tenants rated below investment grade have active leases?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"SELECT DISTINCT n.TNT_NM AS tenant_name FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY LSE_ID ORDER BY UPD_DT DESC) AS rn FROM ${var.catalog}.${var.schema}.legacy_lse) l JOIN ${var.catalog}.${var.schema}.legacy_tnt n ON n.TNT_ID = l.TNT_ID WHERE l.rn = 1 AND l.LSE_STS_CD = 'A' AND n.CR_RTG IN ('BB', 'B')\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"12d42a2026e42a7244df8358db8977fd\",\n        \"question\": [\n          \"What is our net profit margin this quarter?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"SELECT SUM(CASE a.ACCT_CLS_CD WHEN 'R' THEN t.AMT WHEN 'O' THEN -t.AMT WHEN 'M' THEN -t.AMT ELSE 0 END) / SUM(CASE WHEN a.ACCT_CLS_CD = 'R' THEN t.AMT ELSE 0 END) AS net_profit_margin FROM ${var.catalog}.${var.schema}.legacy_gl_txn t JOIN ${var.catalog}.${var.schema}.legacy_gl_acct a ON a.ACCT_ID = t.ACCT_ID WHERE t.FSCL_PRD = '2026-Q2'\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"488b3b681007b130fd1d97cd178523a6\",\n        \"question\": [\n          \"Show net profit by region for 2026-Q2.\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"SELECT p.RGN_NM AS region_name, SUM(CASE a.ACCT_CLS_CD WHEN 'R' THEN t.AMT WHEN 'O' THEN -t.AMT WHEN 'M' THEN -t.AMT ELSE 0 END) AS net_profit FROM ${var.catalog}.${var.schema}.legacy_gl_txn t JOIN ${var.catalog}.${var.schema}.legacy_gl_acct a ON a.ACCT_ID = t.ACCT_ID JOIN ${var.catalog}.${var.schema}.legacy_prp_mstr p ON p.PRP_ID = t.PRP_ID WHERE t.FSCL_PRD = '2026-Q2' GROUP BY p.RGN_NM\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"6e3bc0b6b9d1b726cc3d359f3215fb3e\",\n        \"question\": [\n          \"What share of properties met their net profit target in 2026-Q2?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"WITH np AS (SELECT t.PRP_ID, SUM(CASE a.ACCT_CLS_CD WHEN 'R' THEN t.AMT WHEN 'O' THEN -t.AMT WHEN 'M' THEN -t.AMT ELSE 0 END) AS net_profit FROM ${var.catalog}.${var.schema}.legacy_gl_txn t JOIN ${var.catalog}.${var.schema}.legacy_gl_acct a ON a.ACCT_ID = t.ACCT_ID WHERE t.FSCL_PRD = '2026-Q2' GROUP BY t.PRP_ID) SELECT AVG(CASE WHEN np.net_profit >= g.NP_TGT_AMT THEN 1.0 ELSE 0.0 END) AS share_met_target FROM np JOIN ${var.catalog}.${var.schema}.legacy_qtr_tgt g ON g.PRP_ID = np.PRP_ID AND g.FSCL_QTR = '2026-Q2'\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"809a34d0837bc257575a8348b64b2910\",\n        \"question\": [\n          \"How many active leases do we have?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"SELECT COUNT(*) AS active_leases FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY LSE_ID ORDER BY UPD_DT DESC) AS rn FROM ${var.catalog}.${var.schema}.legacy_lse) WHERE rn = 1 AND LSE_STS_CD = 'A'\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"93502226bf515afe4a1a6ac27710585e\",\n        \"question\": [\n          \"Which properties missed their net profit target in 2026-Q2?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"WITH np AS (SELECT t.PRP_ID, SUM(CASE a.ACCT_CLS_CD WHEN 'R' THEN t.AMT WHEN 'O' THEN -t.AMT WHEN 'M' THEN -t.AMT ELSE 0 END) AS net_profit FROM ${var.catalog}.${var.schema}.legacy_gl_txn t JOIN ${var.catalog}.${var.schema}.legacy_gl_acct a ON a.ACCT_ID = t.ACCT_ID WHERE t.FSCL_PRD = '2026-Q2' GROUP BY t.PRP_ID) SELECT p.PRP_NM AS property_name FROM np JOIN ${var.catalog}.${var.schema}.legacy_qtr_tgt g ON g.PRP_ID = np.PRP_ID AND g.FSCL_QTR = '2026-Q2' JOIN ${var.catalog}.${var.schema}.legacy_prp_mstr p ON p.PRP_ID = np.PRP_ID WHERE np.net_profit < g.NP_TGT_AMT\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"b2c0b6b96c8b1af07466198a5af3c2de\",\n        \"question\": [\n          \"What was total net profit in 2026-Q2?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"SELECT SUM(CASE a.ACCT_CLS_CD WHEN 'R' THEN t.AMT WHEN 'O' THEN -t.AMT WHEN 'M' THEN -t.AMT ELSE 0 END) AS net_profit FROM ${var.catalog}.${var.schema}.legacy_gl_txn t JOIN ${var.catalog}.${var.schema}.legacy_gl_acct a ON a.ACCT_ID = t.ACCT_ID WHERE t.FSCL_PRD = '2026-Q2'\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"dba254a7f6e27f7e1158728f140d8750\",\n        \"question\": [\n          \"How much CapEx did we spend in 2026-Q2?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"SELECT SUM(t.AMT) AS capex FROM ${var.catalog}.${var.schema}.legacy_gl_txn t JOIN ${var.catalog}.${var.schema}.legacy_gl_acct a ON a.ACCT_ID = t.ACCT_ID WHERE t.FSCL_PRD = '2026-Q2' AND a.ACCT_CLS_CD = 'C'\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"e71e90e2247ce7c716146ef7157d51c5\",\n        \"question\": [\n          \"What was total revenue of our office properties in 2026-Q2?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"SELECT SUM(t.AMT) AS revenue FROM ${var.catalog}.${var.schema}.legacy_gl_txn t JOIN ${var.catalog}.${var.schema}.legacy_gl_acct a ON a.ACCT_ID = t.ACCT_ID JOIN ${var.catalog}.${var.schema}.legacy_prp_mstr p ON p.PRP_ID = t.PRP_ID WHERE t.FSCL_PRD = '2026-Q2' AND a.ACCT_CLS_CD = 'R' AND p.PRP_TYP_CD = 'OFF'\"\n            ]\n          }\n        ]\n      },\n      {\n        \"id\": \"efb17c93288969538eaa7d8b6a722c34\",\n        \"question\": [\n          \"What is the total monthly rent of our active leases?\"\n        ],\n        \"answer\": [\n          {\n            \"format\": \"SQL\",\n            \"content\": [\n              \"SELECT SUM(MTH_RNT_AMT) AS monthly_rent FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY LSE_ID ORDER BY UPD_DT DESC) AS rn FROM ${var.catalog}.${var.schema}.legacy_lse) WHERE rn = 1 AND LSE_STS_CD = 'A'\"\n            ]\n          }\n        ]\n      }\n    ]\n  }\n}"
      permissions:
        - group_name: ${var.consumer_group}
          level: CAN_RUN
